<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harvest | 画像を集める</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="index.js" defer></script>
  </head>
  <body>
    <div class="app-header">
      <header class="topbar"><h1>Harvest</h1><span>ページの画像からPDFを作成</span></header>
      <section class="controls" aria-labelledby="source-heading">
        <h2 id="source-heading">ページを解析</h2>
        <p class="hint">URLを指定しない場合は、開いているページを解析します。</p>
        <div class="source-row">
          <label for="source-url">URL指定</label>
          <input id="source-url" type="url" inputmode="url" placeholder="https://example.com/" autocomplete="url">
          <button id="scan" type="button">解析</button>
        </div>
      </section>
      <div class="results-controls">
        <div class="section-head"><h2 id="images-heading">画像</h2><span id="count">0枚</span></div>
        <div class="filter-bar"><span>表示する画像</span><div id="groups" class="groups" role="group" aria-label="表示する画像" hidden></div></div>
        <div class="toolbar"><button id="select-all" type="button" disabled>すべて選択</button><button id="clear-all" type="button" disabled>選択を解除</button></div>
      </div>
    </div>
    <main>
      <section class="results" aria-labelledby="images-heading">
        <div id="completion" class="completion" hidden><p>PDFの保存を開始しました。</p><button id="back-to-images" type="button">画像一覧に戻る</button></div>
        <div id="links" class="links" hidden></div>
        <p id="empty">「解析」を押すと、開いているページの画像を表示します。</p>
        <ol id="images" class="image-list"></ol>
      </section>
      <aside class="export" aria-labelledby="export-heading">
        <h2 id="export-heading">PDFを保存</h2>
        <p>選択した画像を、一覧の上から順に1枚ずつページに配置します。矢印で順番を変えられます。</p>
        <label class="quality"><input id="high-quality" type="checkbox" checked> 高画質で保存</label>
        <button id="export" type="button" disabled>選択した画像をPDFにする</button>
        <p id="status" role="status" aria-live="polite"></p>
        <button id="reset" type="button">結果を消す</button>
      </aside>
    </main>
  </body>
</html>
