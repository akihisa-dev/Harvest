<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harvest | 画像を集める</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="index.js" defer></script>
  </head>
  <body>
    <div class="app-header">
      <section class="controls" aria-labelledby="source-heading">
        <div class="visually-hidden"><h2 id="source-heading"><label for="source-url">ページURL</label></h2><span>任意</span></div>
        <div class="source-row">
          <button id="source-drop" type="button">ページURLをドロップ、またはクリックして入力</button>
          <input id="source-url" type="url" inputmode="url" placeholder="ページURLを入力" autocomplete="url" aria-describedby="source-hint" hidden>
          <button id="scan" type="button">解析</button>
        </div>
        <p id="source-hint" class="visually-hidden">空欄なら、開いているページを解析します。</p>
      </section>
      <aside class="save-area" aria-labelledby="export-heading">
        <h2 id="export-heading" class="visually-hidden">PDFを保存</h2>
        <button id="export" type="button" disabled>PDFを保存</button>
      </aside>
      <div class="results-controls">
        <div class="results-heading">
          <div class="section-head"><h2 id="images-heading">画像</h2><span id="count">0枚</span></div>
          <div class="toolbar" role="group" aria-label="収集した画像すべての選択">
            <button id="select-all" type="button" title="表示していない画像も含めて、すべて選択" disabled>すべて選択</button>
            <button id="clear-all" type="button" title="表示していない画像も含めて、選択を解除" disabled>選択を解除</button>
          </div>
        </div>
        <div class="filter-bar"><span>表示</span><div id="groups" class="groups" role="group" aria-label="表示する画像" hidden></div></div>
        <div class="selection-bar"><span>PDF</span><div id="group-selections" class="group-selections" role="group" aria-label="PDFに含める画像" hidden></div></div>
        <aside class="viewer-controls" aria-label="ビュアーモード">
          <button id="viewer-toggle" type="button" aria-pressed="false" disabled>ビュアーモード</button>
          <div class="viewer-meta">
            <p id="status" role="status" aria-live="polite"></p>
            <button id="reset" type="button" class="quiet-button">結果を消す</button>
          </div>
        </aside>
      </div>
    </div>
    <main>
      <section class="results" aria-labelledby="images-heading">
        <div id="completion" class="completion" hidden><p>PDFの保存を開始しました。</p><button id="back-to-images" type="button">画像一覧に戻る</button></div>
        <p id="empty">ここに画像が並びます。<br>「解析」を押して、画像を集めましょう。</p>
        <ol id="images" class="image-list"></ol>
      </section>
      <section id="viewer" class="viewer" aria-label="選択した画像のビュアー" hidden>
        <p id="viewer-empty">PDFに含める画像が選択されていません。</p>
        <div id="viewer-page" class="viewer-page" hidden>
          <div class="viewer-primary">
            <div class="viewer-navigation">
              <button id="viewer-previous" type="button">前へ</button>
              <span id="viewer-position" aria-live="polite"></span>
              <button id="viewer-next" type="button">次へ</button>
              <div class="viewer-zoom" role="group" aria-label="画像の拡大と縮小">
                <button id="viewer-zoom-out" type="button" aria-label="縮小">−</button>
                <button id="viewer-zoom-reset" type="button" aria-label="表示倍率を戻す">100%</button>
                <button id="viewer-zoom-in" type="button" aria-label="拡大">＋</button>
              </div>
            </div>
            <div id="viewer-stage" class="viewer-stage" aria-label="画像。ホイールで拡大縮小、拡大中はドラッグで移動">
              <img id="viewer-image" alt="" referrerpolicy="no-referrer" draggable="false">
            </div>
            <p id="viewer-filename"></p>
          </div>
          <aside class="viewer-thumbnails" aria-label="選択した画像のサムネイル">
            <ol id="viewer-thumbnails"></ol>
          </aside>
        </div>
      </section>
    </main>
  </body>
</html>
